
name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Audio playback and offline storage
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

  # Supabase audio hosting
  supabase_flutter: ^2.18.3

  # Local storage
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/kids/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/smart_rosary_icon.png"
  adaptive_icon_background: "#10102A"
  adaptive_icon_foreground: "assets/icon/smart_rosary_icon.png"